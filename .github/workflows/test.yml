name: Test CLI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Install and update packed CLI in sandbox
        shell: bash
        run: |
          PACKAGE=$(npm pack --ignore-scripts --silent)
          npx --yes --package "./$PACKAGE" omp-setup init --target ./sandbox-agent
          npx --yes --package "./$PACKAGE" omp-setup update --target ./sandbox-agent
